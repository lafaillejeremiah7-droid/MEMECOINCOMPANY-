# Operator-requested OFF state. This workflow never starts the scanner.
name: Signal company OFF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/run-scanner.yml']

permissions:
  contents: read
  actions: read

# Supersede pending deployments and cancel the currently running signal session.
concurrency:
  group: signal-company-state
  cancel-in-progress: true

jobs:
  confirm-off:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout shutdown controller
        uses: actions/checkout@v4

      - name: Verify company is stopped and notify existing Telegram chat
        uses: actions/github-script@v7
        env:
          MEMESCANNER_TELEGRAM_BOT_TOKEN: ${{ secrets.MEMESCANNER_TELEGRAM_BOT_TOKEN }}
          MEMESCANNER_TELEGRAM_CHAT_ID: ${{ secrets.MEMESCANNER_TELEGRAM_CHAT_ID }}
        with:
          script: |
            const {confirmShutdown} = require('./scripts/signal_shutdown.cjs');
            await confirmShutdown({github, context, core});

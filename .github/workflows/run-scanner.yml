# Finite signal-only deployment. No wallets or simulated execution.
name: Run Scanner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read
  actions: read

concurrency:
  group: signal-company-state
  cancel-in-progress: false

jobs:
  run-scanner:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MEMESCANNER_TAVILY_API_KEY: ${{ secrets.MEMESCANNER_TAVILY_API_KEY }}
      MEMESCANNER_XAI_API_KEY: ${{ secrets.MEMESCANNER_XAI_API_KEY }}
      MEMESCANNER_HELIUS_RPC_URL: ${{ secrets.MEMESCANNER_HELIUS_RPC_URL }}
      MEMESCANNER_TELEGRAM_BOT_TOKEN: ${{ secrets.MEMESCANNER_TELEGRAM_BOT_TOKEN }}
      MEMESCANNER_TELEGRAM_CHAT_ID: ${{ secrets.MEMESCANNER_TELEGRAM_CHAT_ID }}
      MEMESCANNER_ENABLE_PAPER_TRADING: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate required configuration
        run: python scripts/signal_state.py preflight

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Locate previous signal state
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {findPreviousSignalState} = require('./scripts/signal_history.cjs');
            await findPreviousSignalState({github, context, core});

      - name: Restore observation and alert history
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: signal-state
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .

      - name: Validate restored history
        if: steps.previous.outputs.run_id != ''
        run: python scripts/signal_state.py verify

      - name: Run a 30-minute signal session
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 30m python -m memescanner
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ "$result" -ne 124 ]; then exit "$result"; fi

      - name: Checkpoint observations and delivery claims
        if: always()
        run: python scripts/signal_state.py checkpoint

      - name: Report forward validation without claiming live fills
        if: always() && hashFiles('memescanner.db') != ''
        run: python -m memescanner.validation --report memescanner.db

      - name: Preserve signal history
        if: always() && hashFiles('signal-state/memescanner.db') != ''
        uses: actions/upload-artifact@v4
        with:
          name: signal-state
          path: signal-state/memescanner.db
          if-no-files-found: error
          retention-days: 90

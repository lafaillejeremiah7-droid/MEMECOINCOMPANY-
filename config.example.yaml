# Secrets may be left empty here and supplied through environment variables.
telegram:
  bot_token: ""  # MEMESCANNER_TELEGRAM_BOT_TOKEN
  chat_id: ""    # MEMESCANNER_TELEGRAM_CHAT_ID

scanner:
  check_interval_seconds: 15
  min_candidate_age_minutes: 0
  max_candidate_age_minutes: 120
  # Bounds DEX pair calls so the 15-second loop remains below public API limits.
  # Unchecked candidates are persisted as deferred and rotate into later cycles.
  max_market_checks_per_cycle: 40
  # Legacy simulation setting. Production ignores it and sends signals only.
  enable_paper_trading: false  # MEMESCANNER_ENABLE_PAPER_TRADING
  # Concurrent virtual positions. 1 means one coin at a time.
  #
  # Micro mode always enforces one position. Independent exit checks run every
  # two seconds after each completed check, targeting a maximum 15-minute hold.
  # Missing exit quotes retain the slot; the simulator never invents a fill.
  max_open_positions: 1

# All enabled adapters discover Solana candidates independently. Pump.fun is
# additive; DEX discovery is launchpad-neutral, not a promise of every token.
sources:
  dexscreener_profiles: true
  dexscreener_latest_boosts: true
  geckoterminal_new_pools: true
  pump_fun: true

evidence:
  # Accepts either a Tavily key (tvly-...) or an X.ai key (xai-...).
  # When an xai- prefixed key is set, the scanner uses the X.ai Responses
  # API with the x_search tool instead of Tavily for X/Twitter evidence.
  tavily_api_key: ""  # MEMESCANNER_TAVILY_API_KEY
  # Explicit slot for an X.ai key. Setting BOTH this and a real Tavily key above
  # runs the two backends together and splits them by role: Tavily returns a
  # plain list of matching x.com pages and supplies the mention count in about a
  # second, while X.ai reads post text for scam and big-account signals. This is
  # strongly recommended: an X.ai x_search call takes 40-90 seconds, so using it
  # alone makes any cycle that reaches the X gate correspondingly slow.
  xai_api_key: ""  # MEMESCANNER_XAI_API_KEY
  # Prefer a complete endpoint via MEMESCANNER_HELIUS_RPC_URL. Alternatively,
  # MEMESCANNER_HELIUS_API_KEY builds the standard Helius endpoint at runtime.
  helius_rpc_url: ""
  # Token-2022 transfer fees above 100 basis points (1%) are rejected.
  # Mutable or unknown fee configuration is also rejected.
  max_transfer_fee_bps: 100
  # Optional exact Token-2022 transfer-hook program IDs. Empty is fail-closed;
  # allowlisted hooks still require an explicitly revoked mutation authority.
  transfer_hook_allowlist: []  # MEMESCANNER_TRANSFER_HOOK_ALLOWLIST=id1,id2

filters:
  min_liquidity_usd: 5000
  # Market cap floor filters dead/micro tokens. Solana high-return median ~$214K.
  min_market_cap_usd: 50000
  # Volume floor filters wash-traded tokens. Median fake volume on Solana ~$10K.
  min_volume_24h_usd: 25000
  min_buy_sell_ratio: 1.0
  max_dev_holding_pct: 30
  # Top-10 holder concentration ceiling.
  max_top10_concentration_pct: 30
  # Minimum X search results required. Each result summarizes multiple posts,
  # so 5 results maps to approximately 10-20 real tweets. Bypassed when a
  # celebrity/influencer account posted or evidence shows viral view counts.
  min_x_mentions: 5
  # Liquidity Pool-Based Price Inflation (LPI) guard: a high market cap held up
  # by a shallow pool is manufactured price growth, not real demand. Reject when
  # liquidity_usd / market_cap falls below this ratio.
  min_liquidity_to_mcap_ratio: 0.08
  # Second LPI guard: reject a 1h price spike above this percentage when
  # turnover (volume_to_mcap_ratio) stays below min_spike_volume_to_mcap_ratio.
  max_spike_price_change_1h_pct: 100
  min_spike_volume_to_mcap_ratio: 0.5
  # SCORING REFERENCE POINT, NOT A REJECTION THRESHOLD. Average trade size is
  # volume_24h / (buys_24h + sells_24h). A study of 655,770 pump.fun tokens
  # found trade fragmentation — many tiny bot trades versus few larger, more
  # committed ones — to be the strongest single predictor of token success.
  # This value is the average trade size at which the bounded score term
  # reaches roughly its midpoint (max +15 points) and at which the take-profit
  # target gets a small bump. No value here rejects a candidate: the signal is
  # uncalibrated in this pipeline until the prospective cohort can test it.
  reference_avg_trade_size_usd: 50

# Prospective research collection is observation-only and enabled by default.
# It never changes signals, paper positions, real risk, or execution behavior.
calibration:
  collect_outcomes: true  # MEMESCANNER_COLLECT_OUTCOMES
  # Keys are fixed horizons in seconds; values are maximum capture windows.
  horizon_windows_seconds:
    0: 120
    3600: 300
    21600: 900
    86400: 3600
  max_jobs_per_pass: 30
  max_outcome_concurrency: 5
  outcome_poll_seconds: 2
  retry_delay_seconds: 15
  report_interval_seconds: 86400
  policy_version: "unified-safety-v5-liquidity"
  feature_schema_version: "screening-rank-v3"
  definition_version: "price-return-2x-v1"
  # Conservative chronological holdout gates. Until every gate passes, reports
  # say INSUFFICIENT_DATA_FOR_CALIBRATION and emit no probability claims.
  purge_gap_seconds: 86400
  min_capture_coverage: 0.90
  min_feature_coverage: 0.90
  min_train_samples: 500
  min_holdout_samples: 500
  min_holdout_class_count: 50
  min_score_band_samples: 100
  min_reportable_score_bands: 2

database:
  path: "memescanner.db"

logging:
  level: "INFO"
  file: "memescanner.log"

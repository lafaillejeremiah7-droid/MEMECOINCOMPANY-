# =============================================================================
# Trader Development Journal Configuration
# =============================================================================
# IMPORTANT: This system is JOURNAL-ONLY. It NEVER auto-executes trades.
# It observes, measures, and alerts. YOU decide all actions.
# =============================================================================

# --- Telegram Settings ---
# Used for sending daily/weekly summaries and alerts.
# Create a bot via @BotFather on Telegram to get your token.
# Get your chat ID by messaging @userinfobot.
# You can reuse the same bot/chat from the NAS100 signal bot.
telegram:
  bot_token: "YOUR_BOT_TOKEN_HERE"
  chat_id: "YOUR_CHAT_ID_HERE"

# --- Account Settings ---
account:
  default_instrument: "NAS100"   # Default instrument for trades
  currency: "USD"                # Currency for P&L display

# --- Alert Thresholds ---
alerts:
  # Setup decay: alert when live win rate drops this many percentage points
  # below the expected win rate (e.g., 15 means alert at -15pp drift)
  wr_decay_threshold_pp: 15

  # Max drawdown: alert when cumulative drawdown exceeds this amount (in $)
  max_drawdown_threshold: 5000.0

  # Development loop: prompt review after this many closed trades
  review_interval_trades: 20

# --- Database Settings ---
database:
  path: "journal.db"             # SQLite database file path

# --- Logging ---
logging:
  level: "INFO"                  # DEBUG, INFO, WARNING, ERROR
  file: "journal.log"            # Log file path
